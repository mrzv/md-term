[package]
name = "md-term"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A graphical Markdown viewer for Kitty, Ghostty, and WezTerm"
license = "MIT"

[[bin]]
name = "mdterm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svgtypes = "0.15"
tempfile = "3"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
